# RetroArch overrides for WSL2 recording sessions.
#
# WSL runs no udev daemon, so RetroArch's default udev joypad driver enumerates
# nothing and the controller appears dead. SDL reads /dev/input directly and
# does see the pad (verified: SDL_NumJoysticks = 1, DualSense named correctly).
input_joypad_driver = "sdl2"

# Autoconfig maps the pad without a per-device profile.
input_autodetect_enable = "true"

# Keep recording honest: no rewind or runahead, both of which manipulate
# emulation in ways a recorded input stream cannot reproduce.
rewind_enable = "false"
run_ahead_enabled = "false"
video_frame_delay = "0"

# Menu toggle on a keyboard key, so the pad is free for the game.
input_menu_toggle = "f1"

# Window placement. Under WSLg the default position can put the window partly
# off-screen; pin it near the top-left at a 4:3 size that suits N64 output.
video_fullscreen = "false"
# Do NOT save window positions. WSLg emits a resize when the window loses
# focus, and RetroArch persists that shrunken geometry - so clicking away
# permanently shrinks the window. Pin the size instead.
video_window_save_positions = "false"
video_windowed_position_x = "60"
video_windowed_position_y = "60"
video_windowed_position_width = "1280"
video_windowed_position_height = "960"
video_window_opacity = "100"

# Fixed windowed scale, so geometry cannot drift on focus changes.
video_windowed_scale = "3"
video_scale_integer = "false"
video_smooth = "true"
